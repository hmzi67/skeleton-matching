<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Pose Matcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css" />
  <style>
    body { 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      padding: 24px;
      min-height: 100vh;
      background: #0f0f0f;
      position: relative;
    }
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 400px;
      background: radial-gradient(ellipse at center, rgba(45,212,191,0.06) 0%, transparent 70%);
      pointer-events: none;
    }
    .logo { 
      font-size: 1.5rem; 
      font-weight: 800; 
      color: #2dd4bf;
      text-align: center; 
      margin-bottom: 36px;
      letter-spacing: -0.02em;
      text-decoration: none;
    }
    .card { width: 100%; max-width: 420px; position: relative; }
    .card h2 { 
      font-size: 1.6rem; 
      font-weight: 700; 
      margin-bottom: 6px;
      color: #fff;
      letter-spacing: -0.02em;
    }
    .card .sub { color: #6b7280; font-size: 0.92rem; margin-bottom: 32px; }
    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 48px; }
    .pw-toggle { 
      position: absolute; 
      right: 14px; 
      top: 50%; 
      transform: translateY(-50%); 
      background: none; 
      border: none; 
      color: #525252; 
      cursor: pointer; 
      font-size: 0.85rem; 
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }
    .pw-toggle:hover { color: #a3a3a3; }
    .footer-link { 
      text-align: center; 
      margin-top: 24px; 
      font-size: 0.88rem; 
      color: #525252; 
    }
    .footer-link a { 
      color: #2dd4bf; 
      text-decoration: none; 
      font-weight: 500;
    }
    .footer-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <a class="logo" href="/">Pose Matcher</a>

  <div class="card">
    <h2>Welcome back</h2>
    <p class="sub">Sign in to your account</p>

    <div class="alert alert-error" id="errMsg"></div>

    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="your username" autocomplete="username" />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="pw-wrap">
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" />
        <button class="pw-toggle" id="pwToggle" type="button">
          <svg id="eyeOpen" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 9s3-6 8-6 8 6 8 6-3 6-8 6-8-6-8-6z"/>
            <circle cx="9" cy="9" r="3"/>
          </svg>
          <svg id="eyeClosed" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <path d="M14.12 14.12A8.94 8.94 0 019 16c-5 0-8-6-8-6a16.07 16.07 0 013.88-4.88M6.12 6.12A3 3 0 0112 9a2.98 2.98 0 01-.88 2.12"/>
            <line x1="1" y1="1" x2="17" y2="17"/>
          </svg>
        </button>
      </div>
    </div>

    <button class="btn btn-primary btn-full" id="loginBtn">Sign In</button>

    <p class="footer-link">No account? <a href="/register">Create one</a></p>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/auth.js"></script>
  <script>
    if (Auth.isLoggedIn()) {
      window.location.replace(Auth.isAdmin() ? '/admin' : '/');
    }

    const pwToggle = document.getElementById('pwToggle');
    const pwInput = document.getElementById('password');
    const eyeOpen = document.getElementById('eyeOpen');
    const eyeClosed = document.getElementById('eyeClosed');
    
    pwToggle.addEventListener('click', () => {
      const show = pwInput.type === 'password';
      pwInput.type = show ? 'text' : 'password';
      eyeOpen.style.display = show ? 'none' : 'block';
      eyeClosed.style.display = show ? 'block' : 'none';
    });

    document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

    document.getElementById('loginBtn').addEventListener('click', doLogin);

    async function doLogin() {
      const btn = document.getElementById('loginBtn');
      const errMsg = document.getElementById('errMsg');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      errMsg.classList.remove('visible');
      if (!username || !password) {
        errMsg.textContent = 'Please fill in all fields.';
        errMsg.classList.add('visible');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();

        if (!res.ok) {
          errMsg.textContent = data.error || 'Login failed.';
          errMsg.classList.add('visible');
          btn.disabled = false;
          btn.textContent = 'Sign In';
          return;
        }

        Auth.save(data.token, { username: data.username, role: data.role });
        window.location.href = data.role === 'admin' ? '/admin' : '/';
      } catch {
        errMsg.textContent = 'Network error. Is the server running?';
        errMsg.classList.add('visible');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }
  </script>
</body>
</html>
