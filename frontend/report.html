<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Session Report — Pose Matcher</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    .report-wrap { max-width: 1100px; margin: 0 auto; padding: 24px; color: #eaeaea; }
    .report-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding: 18px 22px; background: #1c1c22; border-radius: 12px; }
    .report-header h1 { margin: 0 0 6px 0; font-size: 22px; }
    .report-header .meta { color: #9aa0a6; font-size: 13px; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .download-btn { border: none; border-radius: 8px; padding: 8px 12px; background: #2d5e8f; color: #fff; font-size: 12px; font-weight: 700; cursor: pointer; }
    .download-btn:hover { background: #3b78b8; }
    .grade-badge { padding: 6px 14px; border-radius: 999px; font-weight: 700; font-size: 14px; }
    .grade-Excellent { background: #1f6f3e; color: #d4ffe0; }
    .grade-Good      { background: #2d5e8f; color: #d8ecff; }
    .grade-Needs     { background: #8b6a1f; color: #ffeac4; }
    .grade-Poor      { background: #8b2a2a; color: #ffd5d5; }
    .partial-pill    { display: inline-block; margin-left: 10px; padding: 3px 9px; border-radius: 999px; background: #444; color: #ffd; font-size: 11px; }
    .set-card { background: #1c1c22; border-radius: 12px; padding: 18px 22px; margin-bottom: 18px; }
    .set-card h2 { margin: 0 0 12px 0; font-size: 16px; display: flex; gap: 12px; align-items: center; }
    .set-acc { font-weight: 700; color: #fff; }
    .reps-row { display: flex; align-items: flex-end; gap: 8px; height: 140px; padding: 12px 0; }
    .rep-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .rep-bar { width: 100%; background: #444; border-radius: 4px 4px 0 0; min-height: 4px; transition: height .3s; }
    .rep-bar.good { background: #4caf50; }
    .rep-bar.mid  { background: #ffc107; }
    .rep-bar.bad  { background: #f44336; }
    .rep-label { font-size: 10px; color: #9aa0a6; }
    .rep-pct { font-size: 11px; color: #ddd; font-weight: 600; }
    .joints-panel { background: #1c1c22; border-radius: 12px; padding: 18px 22px; margin-bottom: 18px; }
    .joints-panel h2 { margin: 0 0 14px 0; font-size: 16px; }
    .joint-row { display: grid; grid-template-columns: 180px 1fr 80px 90px; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid #2a2a30; }
    .joint-row:last-child { border-bottom: none; }
    .joint-bar-track { background: #2a2a30; height: 12px; border-radius: 6px; overflow: hidden; }
    .joint-bar-fill { height: 100%; border-radius: 6px; }
    .sev-mild     { background: #ffc107; }
    .sev-moderate { background: #ff8c2a; }
    .sev-critical { background: #f44336; }
    .sev-pill { padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; text-align: center; }
    .pill-mild     { background: #4a3d12; color: #ffe9a8; }
    .pill-moderate { background: #5a3411; color: #ffd2a8; }
    .pill-critical { background: #5a1414; color: #ffc4c4; }
    .summary-row { display: flex; gap: 24px; padding: 14px 22px; background: #1c1c22; border-radius: 12px; }
    .summary-stat { flex: 1; }
    .summary-stat .label { color: #9aa0a6; font-size: 12px; }
    .summary-stat .value { font-size: 22px; font-weight: 700; color: #fff; }
    .empty { color: #9aa0a6; font-style: italic; padding: 12px 0; }
  </style>
</head>
<body>
  <div class="report-wrap">
    <div id="report-root">
      <p class="empty">Loading report…</p>
    </div>
  </div>

  <script src="/auth.js"></script>
  <script>
  (async function () {
    if (!Auth.isLoggedIn()) { window.location.href = '/login'; return; }

    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('session');
    const root = document.getElementById('report-root');

    if (!sessionId) {
      root.innerHTML = '<p class="empty">No session id provided.</p>';
      return;
    }

    window.__sessionReportId = sessionId;

    let data;
    try {
      const res = await Auth.apiFetch(`/api/session/${sessionId}/report`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      data = await res.json();
    } catch (e) {
      root.innerHTML = `<p class="empty">Failed to load report: ${e.message}</p>`;
      return;
    }

    root.innerHTML = renderReport(data);
  })();

  function gradeClass(grade) {
    if (grade === 'Needs Work') return 'grade-Needs';
    return 'grade-' + (grade || 'Poor');
  }
  function pct(n) { return Math.round((n || 0) * 100); }
  function repColor(acc) {
    if (acc >= 0.90) return 'good';
    if (acc >= 0.75) return 'mid';
    return 'bad';
  }
  function humanExercise(name) {
    if (!name) return '';
    return name.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  }

  function renderReport(data) {
    const session = data.session || {};
    const setReports = data.set_reports || [];
    const sessionReport = data.session_report;

    const overallGrade = sessionReport ? sessionReport.grade : (setReports.slice(-1)[0]?.grade || 'Poor');
    const overallAcc   = sessionReport ? sessionReport.overall_accuracy : (setReports.slice(-1)[0]?.overall_accuracy || 0);
    const completed    = sessionReport ? sessionReport.completed : !!session.completed;

    const dateStr = session.started_at ? new Date(session.started_at).toLocaleString() : '';

    let html = '';
    html += `
      <div class="report-header">
        <div>
          <h1>${humanExercise(session.exercise_name)} ${completed ? '' : '<span class="partial-pill">Partial session</span>'}</h1>
          <div class="meta">${dateStr}</div>
        </div>
        <div class="header-actions">
          <button class="download-btn" onclick="downloadSessionReportPdf()">Download PDF</button>
          <div class="grade-badge ${gradeClass(overallGrade)}">${overallGrade} · ${pct(overallAcc)}%</div>
        </div>
      </div>
    `;

    if (setReports.length === 0) {
      html += '<p class="empty">No sets recorded for this session.</p>';
      return html;
    }

    setReports.forEach(sr => {
      html += renderSetCard(sr);
    });

    // Problem joints panel — prefer the session report's ranking; fall back to last set's.
    const problems = (sessionReport && sessionReport.problem_joints) || (setReports.slice(-1)[0]?.problem_joints || []);
    html += renderJointsPanel(problems);

    if (sessionReport) {
      html += `
        <div class="summary-row">
          <div class="summary-stat"><div class="label">Overall accuracy</div><div class="value">${pct(sessionReport.overall_accuracy)}%</div></div>
          <div class="summary-stat"><div class="label">Total reps</div><div class="value">${sessionReport.total_reps}</div></div>
          <div class="summary-stat"><div class="label">Sets completed</div><div class="value">${(sessionReport.sets || []).length}</div></div>
          <div class="summary-stat"><div class="label">Status</div><div class="value">${sessionReport.completed ? 'Complete' : 'Partial'}</div></div>
        </div>
      `;
    }

    return html;
  }

  function renderSetCard(sr) {
    const reps = sr.reps || [];
    const repsHtml = reps.map(r => {
      const h = Math.max(4, Math.round((r.accuracy || 0) * 120));
      return `
        <div class="rep-col">
          <div class="rep-pct">${pct(r.accuracy)}%</div>
          <div class="rep-bar ${repColor(r.accuracy)}" style="height:${h}px"></div>
          <div class="rep-label">Rep ${r.rep}</div>
        </div>
      `;
    }).join('');

    return `
      <div class="set-card">
        <h2>Set ${sr.set_number} <span class="set-acc">· ${pct(sr.overall_accuracy)}%</span> <span class="grade-badge ${gradeClass(sr.grade)}">${sr.grade}</span></h2>
        <div class="reps-row">${repsHtml || '<p class="empty">No reps recorded.</p>'}</div>
      </div>
    `;
  }

  function renderJointsPanel(joints) {
    if (!joints || joints.length === 0) {
      return `<div class="joints-panel"><h2>Problem joints</h2><p class="empty">No notable issues detected.</p></div>`;
    }
    const rows = joints.map(j => `
      <div class="joint-row">
        <div>${j.label}</div>
        <div class="joint-bar-track"><div class="joint-bar-fill sev-${j.severity}" style="width:${Math.min(100, j.error_pct)}%"></div></div>
        <div>${j.error_pct}%</div>
        <div class="sev-pill pill-${j.severity}">${j.severity}</div>
      </div>
    `).join('');
    return `<div class="joints-panel"><h2>Problem joints</h2>${rows}</div>`;
  }

  async function downloadSessionReportPdf() {
    const sessionId = window.__sessionReportId;
    if (!sessionId) return;
    try {
      const res = await Auth.apiFetch(`/api/session/${encodeURIComponent(sessionId)}/report/download`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');

      const cd = res.headers.get('content-disposition') || '';
      const fileNameMatch = cd.match(/filename="?([^";]+)"?/i);
      a.href = url;
      a.download = fileNameMatch ? fileNameMatch[1] : `session-report-${sessionId.slice(0, 8)}.pdf`;

      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    } catch (e) {
      alert('Failed to download session PDF report');
    }
  }
  </script>
</body>
</html>
