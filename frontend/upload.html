<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Reference Video — Pose Matcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css" />
  <style>
    /* Override page width for video editing */
    .page-sm {
      max-width: 820px;
    }

    /* Mode Tabs */
    .mode-tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      border-bottom: 1px solid #252525;
      padding-bottom: 16px;
      position: relative;
      z-index: 10;
    }
    .mode-tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: none;
      border: none;
      color: #6b7280;
      cursor: pointer;
      font-size: 0.94rem;
      font-weight: 500;
      transition: all 0.2s;
      position: relative;
    }
    .mode-tab:hover {
      color: #e5e7eb;
    }
    .mode-tab.active {
      color: #2dd4bf;
    }
    .mode-tab.active::after {
      content: '';
      position: absolute;
      bottom: -16px;
      left: 0;
      right: 0;
      height: 3px;
      background: #2dd4bf;
    }

    /* Mode Containers */
    .mode-container {
      display: none;
      pointer-events: none;
    }
    .mode-container.active {
      display: block;
      pointer-events: auto;
    }

    /* Webcam Section */
    .webcam-section {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #0f0f0f;
      border: 1px solid #252525;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    #webcamVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #0f0f0f;
    }
    .camera-status {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.7);
      color: #e5e7eb;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 500;
      display: none;
    }
    .camera-status.visible {
      display: block;
    }

    /* Recording Controls */
    .recording-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      margin-bottom: 24px;
    }
    .timer-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .timer-display {
      font-size: 3.5rem;
      font-weight: 800;
      color: #2dd4bf;
      font-family: 'Courier New', monospace;
      line-height: 1;
      min-width: 180px;
      text-align: center;
    }
    .timer-display.warning {
      color: #f59e0b;
    }
    .timer-display.critical {
      color: #ef4444;
      animation: pulse 0.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .timer-label {
      font-size: 0.9rem;
      color: #6b7280;
      font-weight: 500;
    }
    .recording-controls button {
      min-width: 200px;
    }

    /* Preview Section */
    .preview-section {
      position: relative;
      margin-bottom: 24px;
    }
    #recordedVideoPreview {
      width: 100%;
      height: auto;
      max-height: 460px;
      background: #0f0f0f;
      border: 1px solid #252525;
      border-radius: 14px;
    }

    /* ---- Trim Editor ---- */
    .trim-editor {
      background: #121212;
      border: 1px solid #252525;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .trim-editor-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .trim-editor-header h3 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .trim-badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      background: rgba(45,212,191,0.12);
      color: #2dd4bf;
      border-radius: 6px;
      font-weight: 500;
    }

    .trim-timeline {
      position: relative;
      height: 64px;
      background: #0f0f0f;
      border-radius: 10px;
      margin-bottom: 16px;
      cursor: pointer;
      user-select: none;
      overflow: hidden;
      border: 1px solid #252525;
    }
    .trim-thumbnails {
      position: absolute;
      inset: 0;
      display: flex;
    }
    .trim-thumbnails canvas {
      height: 100%;
      flex: 1;
    }
    /* Dim regions outside the selected trim range */
    .trim-dim-left, .trim-dim-right {
      position: absolute;
      top: 0;
      height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 1;
      pointer-events: none;
    }
    .trim-dim-left { left: 0; }
    .trim-dim-right { right: 0; }

    .trim-track {
      position: absolute;
      top: 0;
      height: 100%;
      background: rgba(45,212,191,0.08);
      border-left: 3px solid #2dd4bf;
      border-right: 3px solid #2dd4bf;
      z-index: 2;
      box-shadow: 0 0 0 1px rgba(45,212,191,0.15);
    }
    .trim-track.previewing {
      background: rgba(45,212,191,0.18);
      border-color: #5eead4;
      box-shadow: 0 0 12px rgba(45,212,191,0.3);
    }
    .trim-handle {
      position: absolute;
      top: -2px;
      width: 22px;
      height: calc(100% + 4px);
      cursor: ew-resize;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .trim-handle::before {
      content: '';
      position: absolute;
      inset: 4px 6px;
      background: rgba(45,212,191,0.25);
      border-radius: 4px;
    }
    .trim-handle::after {
      content: '';
      width: 4px;
      height: 24px;
      background: #2dd4bf;
      border-radius: 2px;
      box-shadow: 0 0 8px rgba(45,212,191,0.6);
      z-index: 1;
    }
    .trim-handle:hover::after {
      background: #5eead4;
      box-shadow: 0 0 14px rgba(45,212,191,0.8);
      height: 28px;
    }
    .trim-handle-left {
      left: 0;
      transform: translateX(-50%);
    }
    .trim-handle-right {
      right: 0;
      transform: translateX(50%);
    }
    .trim-playhead {
      position: absolute;
      top: 0;
      width: 2px;
      height: 100%;
      background: #fff;
      z-index: 4;
      pointer-events: none;
    }
    .trim-playhead::before {
      content: '';
      position: absolute;
      top: -3px;
      left: -4px;
      width: 10px;
      height: 10px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 4px rgba(255,255,255,0.5);
    }

    .trim-time-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 12px;
    }
    .trim-time-input {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #1a1a1a;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #252525;
    }
    .trim-time-input label {
      font-size: 0.78rem;
      color: #6b7280;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .trim-time-input span {
      font-family: 'Courier New', monospace;
      font-size: 0.95rem;
      color: #e5e7eb;
      font-weight: 600;
      min-width: 50px;
      text-align: center;
    }
    .trim-clip-duration {
      text-align: center;
      font-size: 0.85rem;
      color: #2dd4bf;
      font-weight: 600;
    }

    .trim-controls {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .trim-controls button {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #e5e7eb;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .trim-controls button:hover {
      background: #252525;
      border-color: #2dd4bf;
      color: #2dd4bf;
    }
    .trim-controls button.active {
      background: rgba(45,212,191,0.1);
      border-color: #2dd4bf;
      color: #2dd4bf;
    }
    .trim-controls button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .trim-controls button.previewing {
      background: rgba(45,212,191,0.15);
      border-color: #2dd4bf;
      color: #2dd4bf;
      animation: previewPulse 1.5s infinite;
    }
    @keyframes previewPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(45,212,191,0.3); }
      50% { box-shadow: 0 0 0 4px rgba(45,212,191,0.1); }
    }

    .trim-status {
      text-align: center;
      font-size: 0.82rem;
      color: #6b7280;
      margin-top: 12px;
      min-height: 20px;
    }
    .trim-status.processing {
      color: #f59e0b;
    }
    .trim-status.success {
      color: #22c55e;
    }

    /* Current time overlay on video during preview */
    .trim-time-overlay {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: #2dd4bf;
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 4px 14px;
      border-radius: 6px;
      border: 1px solid rgba(45,212,191,0.3);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 10;
    }
    .trim-time-overlay.visible { opacity: 1; }

    /* Preview Actions */
    .preview-actions {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
    .preview-actions button {
      flex: 1;
    }

    /* Record Progress */
    .record-progress-wrap {
      display: none;
      margin-top: 18px;
    }
    .record-progress-wrap.visible {
      display: block;
    }
    .progress-bg { 
      background: #1a1a1a; 
      border-radius: 99px; 
      height: 8px; 
      overflow: hidden; 
    }
    .progress-fill { 
      height: 100%; 
      background: linear-gradient(90deg, #2dd4bf, #14b8a6); 
      border-radius: 99px; 
      width: 0%; 
      transition: width 0.3s; 
    }
    .progress-lbl { font-size: 0.8rem; color: #6b7280; margin-top: 8px; text-align: right; }

    /* Original Drop Zone & Preview Styles */
    .drop-zone {
      border: 2px dashed #2a2a2a;
      border-radius: 16px;
      padding: 56px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
      background: linear-gradient(145deg, #121212 0%, #0f0f0f 100%);
    }
    .drop-zone:hover, .drop-zone.over { 
      border-color: #2dd4bf; 
      background: rgba(45, 212, 191, 0.03);
    }
    .drop-zone input[type="file"] { 
      position: absolute; 
      inset: 0; 
      opacity: 0; 
      cursor: pointer; 
      width: 100%; 
      height: 100%; 
    }
    .drop-zone .dz-icon { 
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(45,212,191,0.1) 0%, rgba(45,212,191,0.05) 100%);
      border: 1px solid rgba(45,212,191,0.2);
      border-radius: 18px;
      color: #2dd4bf;
    }
    .drop-zone p { color: #6b7280; font-size: 0.94rem; }
    .drop-zone p span { color: #2dd4bf; font-weight: 600; }

    .preview-row { 
      display: none; 
      align-items: center; 
      gap: 18px; 
      background: #121212; 
      border: 1px solid #252525; 
      border-radius: 14px; 
      padding: 16px 20px; 
      margin-top: 18px; 
    }
    .preview-row.visible { display: flex; }
    .preview-row video { 
      width: 100px; 
      height: 68px; 
      object-fit: cover; 
      border-radius: 10px; 
      background: #0f0f0f; 
      flex-shrink: 0; 
    }
    .preview-row .pf-name { 
      font-size: 0.94rem; 
      font-weight: 600; 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis;
      color: #fff;
    }
    .preview-row .pf-size { font-size: 0.8rem; color: #6b7280; margin-top: 4px; }
    .preview-row .close-btn {
      background: none;
      border: none;
      color: #525252;
      cursor: pointer;
      font-size: 1.2rem;
      flex-shrink: 0;
      padding: 4px;
      transition: color 0.2s;
    }
    .preview-row .close-btn:hover { color: #ef4444; }

    .progress-wrap { display: none; margin-top: 18px; }
    .progress-wrap.visible { display: block; }
    .progress-bg { 
      background: #1a1a1a; 
      border-radius: 99px; 
      height: 8px; 
      overflow: hidden; 
    }
    .progress-fill { 
      height: 100%; 
      background: linear-gradient(90deg, #2dd4bf, #14b8a6); 
      border-radius: 99px; 
      width: 0%; 
      transition: width 0.3s; 
    }
    .progress-lbl { font-size: 0.8rem; color: #6b7280; margin-top: 8px; text-align: right; }
  </style>
</head>
<body>
  <nav id="navBar"></nav>

  <div class="page-sm">
    <div class="page-title">Upload Reference Video</div>
    <p class="page-sub">Submit a video of your exercise form. An admin will review and approve it as a reference.</p>

    <div class="card">
      <div class="alert alert-error" id="errMsg"></div>
      <div class="alert alert-success" id="okMsg"></div>

      <!-- Mode Toggle Tabs -->
      <div class="mode-tabs">
        <button class="mode-tab active" data-mode="upload" onclick="switchMode('upload')">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          Upload from Storage
        </button>
        <button class="mode-tab" data-mode="record" onclick="switchMode('record')">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="1" fill="currentColor"/>
            <path d="M12 1v6m4.22-4.22l-4.24 4.24m0 0l-4.24-4.24M7.78 7.78l-4.24-4.24"/>
          </svg>
          Record Video
        </button>
      </div>

      <!-- Upload Mode -->
      <div id="upload-mode" class="mode-container active">
        <div class="field">
          <label for="exercise">Exercise Type</label>
          <select id="exercise">
            <option value="">Loading categories...</option>
          </select>
        </div>

        <!-- Suggest Category Form (hidden by default) -->
        <div id="suggestCategoryForm" class="field" style="display:none;background:#1a1a1a;padding:12px;border-radius:8px;border:1px solid #333;">
          <label for="newCategoryName">New Category Name</label>
          <input type="text" id="newCategoryName" placeholder="e.g., Bicep Curl" style="width:100%;padding:10px;border-radius:6px;border:1px solid #333;background:#0d0d0d;color:#fff;margin-bottom:8px;">
          <label for="newCategoryDesc">Description (optional)</label>
          <input type="text" id="newCategoryDesc" placeholder="Brief description of the exercise" style="width:100%;padding:10px;border-radius:6px;border:1px solid #333;background:#0d0d0d;color:#fff;margin-bottom:8px;">
          <div style="display:flex;gap:8px;">
            <button type="button" id="submitCategoryBtn" class="btn btn-primary" style="flex:1;padding:8px;">Submit for Approval</button>
            <button type="button" id="cancelCategoryBtn" class="btn" style="padding:8px;background:#333;color:#fff;border:none;border-radius:6px;cursor:pointer;">Cancel</button>
          </div>
          <div id="categoryMsg" style="margin-top:8px;font-size:0.85rem;"></div>
        </div>

        <div class="field">
          <label>Video File</label>
          <div class="drop-zone" id="dropZone">
          <input type="file" id="fileInput" accept="video/*" />
          <div class="dz-icon">
            <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
          </div>
          <p><span>Click to browse</span> or drag & drop</p>
          <p style="margin-top:6px;font-size:0.8rem;color:#525252">MP4, MOV, AVI, MKV, WEBM</p>
        </div>
        </div>

        <div class="preview-row" id="previewRow">
          <video id="previewVid" muted></video>
          <div style="flex:1;overflow:hidden">
            <div class="pf-name" id="pfName"></div>
            <div class="pf-size" id="pfSize"></div>
          </div>
          <button onclick="clearFile()" class="close-btn">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>

        <!-- Upload Trim Editor (shown after file selected) -->
        <div class="trim-editor" id="uploadTrimEditor" style="display:none">
          <div class="trim-editor-header">
            <h3>
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
              Trim Clip
              <span class="trim-badge">optional</span>
            </h3>
          </div>

          <div class="preview-section" style="margin-bottom:16px">
            <video id="uploadTrimPreview" controls style="width:100%;max-height:400px;background:#0f0f0f;border:1px solid #252525;border-radius:10px;"></video>
            <div class="trim-time-overlay" id="uploadTrimTimeOverlay"></div>
          </div>

          <div class="trim-timeline" id="uploadTrimTimeline">
            <div class="trim-thumbnails" id="uploadTrimThumbnails"></div>
            <div class="trim-dim-left" id="uploadTrimDimLeft"></div>
            <div class="trim-dim-right" id="uploadTrimDimRight"></div>
            <div class="trim-track" id="uploadTrimTrack">
              <div class="trim-handle trim-handle-left" id="uploadTrimHandleLeft"></div>
              <div class="trim-handle trim-handle-right" id="uploadTrimHandleRight"></div>
            </div>
            <div class="trim-playhead" id="uploadTrimPlayhead"></div>
          </div>

          <div class="trim-time-row">
            <div class="trim-time-input">
              <label>Start</label>
              <span id="uploadTrimStartLabel">0.0s</span>
            </div>
            <div class="trim-clip-duration" id="uploadTrimClipDuration">Clip: 0.0s</div>
            <div class="trim-time-input">
              <label>End</label>
              <span id="uploadTrimEndLabel">0.0s</span>
            </div>
          </div>

          <div class="trim-controls">
            <button onclick="uploadPreviewTrimmedClip()">
              <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16"><polygon points="4,2 14,8 4,14"/></svg>
              Preview Clip
            </button>
            <button onclick="uploadResetTrim()">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
              Reset
            </button>
          </div>
          <div class="trim-status" id="uploadTrimStatus"></div>
        </div>

        <div class="progress-wrap" id="progressWrap">
          <div class="progress-bg"><div class="progress-fill" id="progressFill"></div></div>
          <div class="progress-lbl" id="progressLbl">0%</div>
        </div>

        <button class="btn btn-primary btn-full" id="uploadBtn" disabled>Submit for Review</button>
      </div>

      <!-- Recording Mode Inside Card -->
      <div id="record-mode" class="mode-container">
        <div class="alert alert-error" id="recErrMsg"></div>
        <div class="alert alert-success" id="recOkMsg"></div>
        <div class="field">
          <label for="recordExercise">Exercise Type</label>
          <select id="recordExercise">
            <option value="">Loading categories...</option>
          </select>
        </div>

        <!-- Suggest Category Form for Record Mode (hidden by default) -->
        <div id="recordSuggestCategoryForm" class="field" style="display:none;background:#1a1a1a;padding:12px;border-radius:8px;border:1px solid #333;">
          <label for="recordNewCategoryName">New Category Name</label>
          <input type="text" id="recordNewCategoryName" placeholder="e.g., Bicep Curl" style="width:100%;padding:10px;border-radius:6px;border:1px solid #333;background:#0d0d0d;color:#fff;margin-bottom:8px;">
          <label for="recordNewCategoryDesc">Description (optional)</label>
          <input type="text" id="recordNewCategoryDesc" placeholder="Brief description of the exercise" style="width:100%;padding:10px;border-radius:6px;border:1px solid #333;background:#0d0d0d;color:#fff;margin-bottom:8px;">
          <div style="display:flex;gap:8px;">
            <button type="button" id="recordSubmitCategoryBtn" class="btn btn-primary" style="flex:1;padding:8px;">Submit for Approval</button>
            <button type="button" id="recordCancelCategoryBtn" class="btn" style="padding:8px;background:#333;color:#fff;border:none;border-radius:6px;cursor:pointer;">Cancel</button>
          </div>
          <div id="recordCategoryMsg" style="margin-top:8px;font-size:0.85rem;"></div>
        </div>

        <!-- Recording Interface (hidden when recording ends) -->
        <div id="recording-interface">
          <div class="webcam-section">
            <video id="webcamVideo" autoplay playsinline muted></video>
            <div id="cameraStatus" class="camera-status"></div>
          </div>

          <div class="recording-controls">
            <div class="timer-section">
              <div class="timer-display" id="timerDisplay">20</div>
              <div class="timer-label">seconds</div>
            </div>
            <button class="btn btn-primary" id="startRecordBtn" onclick="startRecording()">

  <div class="toast" id="toast"></div>
  <script src="/auth.js"></script>
  <script>
    Auth.guard();

    const user = Auth.getUser();
    document.getElementById('navBar').innerHTML = `
      <a class="nav-logo" href="/">Pose Matcher</a>
      <div class="nav-links">
        <a href="/">Exercises</a>
        <a href="/dashboard">My Uploads</a>
        <a href="/reports">My Reports</a>
        <a href="/profile">Profile</a>
        <span class="nav-user">${user.username}</span>
        <button class="nav-logout" onclick="Auth.logout()">Logout</button>
      </div>`;

    // Load categories from API
    async function loadCategories() {
      try {
        const res = await fetch('/api/categories');
        if (!res.ok) throw new Error('Failed to load categories');
        const categories = await res.json();
        
        const exerciseSelect = document.getElementById('exercise');
        const recordExerciseSelect = document.getElementById('recordExercise');
        
        // Clear and rebuild options
        const buildOptions = (select) => {
          select.innerHTML = '';
          categories.forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat.name.toLowerCase().replace(/\s+/g, '_');
            opt.textContent = cat.name;
            select.appendChild(opt);
          });
          // Add "Other" fallback
          const otherOpt = document.createElement('option');
          otherOpt.value = 'other';
          otherOpt.textContent = 'Other';
          select.appendChild(otherOpt);
        };
        
        buildOptions(exerciseSelect);
        buildOptions(recordExerciseSelect);
      } catch (err) {
        console.error('Error loading categories:', err);
      }
    }
    
    loadCategories();

    // Suggest category form handling
    const suggestForm = document.getElementById('suggestCategoryForm');
    const cancelCategoryBtn = document.getElementById('cancelCategoryBtn');
    const submitCategoryBtn = document.getElementById('submitCategoryBtn');
    const categoryMsg = document.getElementById('categoryMsg');

    cancelCategoryBtn.addEventListener('click', () => {
      suggestForm.style.display = 'none';
      document.getElementById('newCategoryName').value = '';
      document.getElementById('newCategoryDesc').value = '';
      categoryMsg.textContent = '';
      // Reset dropdown to first option
      document.getElementById('exercise').selectedIndex = 0;
    });

    submitCategoryBtn.addEventListener('click', async () => {
      const name = document.getElementById('newCategoryName').value.trim();
      const description = document.getElementById('newCategoryDesc').value.trim();
      
      if (!name) {
        categoryMsg.innerHTML = '<span style="color:#ef4444;">Please enter a category name</span>';
        return;
      }

      submitCategoryBtn.disabled = true;
      submitCategoryBtn.textContent = 'Submitting...';

      try {
        const res = await Auth.apiFetch('/api/categories', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, description })
        });
        const data = await res.json();
        
        if (res.ok) {
          categoryMsg.innerHTML = '<span style="color:#22c55e;">Category created! It will be used for your upload.</span>';
          
          // Add new category to dropdowns and select it
          const categoryValue = name.toLowerCase().replace(/\s+/g, '_');
          const exerciseSelect = document.getElementById('exercise');
          const recordExerciseSelect = document.getElementById('recordExercise');
          
          // Add to both dropdowns (insert before "Other")
          [exerciseSelect, recordExerciseSelect].forEach(select => {
            const newOpt = document.createElement('option');
            newOpt.value = categoryValue;
            newOpt.textContent = name + ' (pending approval)';
            newOpt.dataset.categoryId = data.id;
            // Insert before "Other" option
            const otherOpt = select.querySelector('option[value="other"]');
            if (otherOpt) {
              select.insertBefore(newOpt, otherOpt);
            } else {
              select.appendChild(newOpt);
            }
          });
          
          // Select the new category
          exerciseSelect.value = categoryValue;
          
          document.getElementById('newCategoryName').value = '';
          document.getElementById('newCategoryDesc').value = '';
          setTimeout(() => {
            suggestForm.style.display = 'none';
            categoryMsg.textContent = '';
          }, 2000);
        } else {
          categoryMsg.innerHTML = `<span style="color:#ef4444;">${data.error || 'Failed to submit'}</span>`;
        }
      } catch (err) {
        categoryMsg.innerHTML = '<span style="color:#ef4444;">Network error</span>';
      }

      submitCategoryBtn.disabled = false;
      submitCategoryBtn.textContent = 'Submit for Approval';
    });

    // Show category form when "Other" is selected, hide when existing category selected
    document.getElementById('exercise').addEventListener('change', (e) => {
      if (e.target.value === 'other') {
        suggestForm.style.display = 'block';
        document.getElementById('newCategoryName').focus();
      } else {
        suggestForm.style.display = 'none';
      }
    });

    // Record mode category form elements
    const recordSuggestForm = document.getElementById('recordSuggestCategoryForm');
    const recordCancelCategoryBtn = document.getElementById('recordCancelCategoryBtn');
    const recordSubmitCategoryBtn = document.getElementById('recordSubmitCategoryBtn');
    const recordCategoryMsg = document.getElementById('recordCategoryMsg');

    recordCancelCategoryBtn.addEventListener('click', () => {
      recordSuggestForm.style.display = 'none';
      document.getElementById('recordNewCategoryName').value = '';
      document.getElementById('recordNewCategoryDesc').value = '';
      recordCategoryMsg.textContent = '';
      // Reset dropdown to first option
      document.getElementById('recordExercise').selectedIndex = 0;
    });

    recordSubmitCategoryBtn.addEventListener('click', async () => {
      const name = document.getElementById('recordNewCategoryName').value.trim();
      const description = document.getElementById('recordNewCategoryDesc').value.trim();
      
      if (!name) {
        recordCategoryMsg.innerHTML = '<span style="color:#ef4444;">Please enter a category name</span>';
        return;
      }

      recordSubmitCategoryBtn.disabled = true;
      recordSubmitCategoryBtn.textContent = 'Submitting...';

      try {
        const res = await Auth.apiFetch('/api/categories', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, description })
        });
        const data = await res.json();
        
        if (res.ok) {
          recordCategoryMsg.innerHTML = '<span style="color:#22c55e;">Category created! It will be used for your upload.</span>';
          
          // Add new category to dropdowns and select it
          const categoryValue = name.toLowerCase().replace(/\s+/g, '_');
          const exerciseSelect = document.getElementById('exercise');
          const recordExerciseSelect = document.getElementById('recordExercise');
          
          // Add to both dropdowns (insert before "Other")
          [exerciseSelect, recordExerciseSelect].forEach(select => {
            const newOpt = document.createElement('option');
            newOpt.value = categoryValue;
            newOpt.textContent = name + ' (pending approval)';
            newOpt.dataset.categoryId = data.id;
            const otherOpt = select.querySelector('option[value="other"]');
            if (otherOpt) {
              select.insertBefore(newOpt, otherOpt);
            } else {
              select.appendChild(newOpt);
            }
          });
          
          // Select the new category in record dropdown
          recordExerciseSelect.value = categoryValue;
          
          document.getElementById('recordNewCategoryName').value = '';
          document.getElementById('recordNewCategoryDesc').value = '';
          setTimeout(() => {
            recordSuggestForm.style.display = 'none';
            recordCategoryMsg.textContent = '';
          }, 2000);
        } else {
          recordCategoryMsg.innerHTML = `<span style="color:#ef4444;">${data.error || 'Failed to submit'}</span>`;
        }
      } catch (err) {
        recordCategoryMsg.innerHTML = '<span style="color:#ef4444;">Network error</span>';
      }

      recordSubmitCategoryBtn.disabled = false;
      recordSubmitCategoryBtn.textContent = 'Submit for Approval';
    });

    document.getElementById('recordExercise').addEventListener('change', (e) => {
      if (e.target.value === 'other') {
        recordSuggestForm.style.display = 'block';
        document.getElementById('recordNewCategoryName').focus();
      } else {
        recordSuggestForm.style.display = 'none';
      }
    });

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const previewRow = document.getElementById('previewRow');
    const previewVid = document.getElementById('previewVid');
    const uploadBtn = document.getElementById('uploadBtn');
    const toast = document.getElementById('toast');
    let selectedFile = null;

    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
    dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('over'); if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]); });
    fileInput.addEventListener('change', () => { if (fileInput.files[0]) setFile(fileInput.files[0]); });

    let uploadTrimState = {
      duration: 0,
      startTime: 0,
      endTime: 0,
      dragging: null,
      playheadRaf: null,
      trimmedBlob: null,
      initialized: false,
      isPreviewing: false,
    };

    function setFile(f) {
      selectedFile = f;
      document.getElementById('pfName').textContent = f.name;
      document.getElementById('pfSize').textContent = (f.size / 1024 / 1024).toFixed(2) + ' MB';
      const url = URL.createObjectURL(f);
      previewVid.src = url;
      previewRow.classList.add('visible');
      uploadBtn.disabled = false;

      const trimPreview = document.getElementById('uploadTrimPreview');
      trimPreview.src = url;

      trimPreview.onloadedmetadata = () => {
        let dur = trimPreview.duration;
        if (isFinite(dur) && dur > 0) {
          uploadTrimState.duration = dur;
          uploadTrimState.startTime = 0;
          uploadTrimState.endTime = dur;
          uploadTrimState.trimmedBlob = null;
          updateUploadTrimUI();
          generateUploadThumbnails(trimPreview);
          document.getElementById('uploadTrimEditor').style.display = 'block';
          if (!uploadTrimState.initialized) {
            setupUploadTrimDragHandlers();
            setupUploadPlayheadTracker();
            uploadTrimState.initialized = true;
          }
        }
      };
    }

    function clearFile() {
      selectedFile = null;
      fileInput.value = '';
      previewVid.src = '';
      previewRow.classList.remove('visible');
      uploadBtn.disabled = true;
      document.getElementById('uploadTrimEditor').style.display = 'none';
      document.getElementById('uploadTrimPreview').src = '';
      document.getElementById('uploadTrimPreview').pause();
      document.getElementById('uploadTrimThumbnails').innerHTML = '';
      document.getElementById('uploadTrimTimeOverlay').classList.remove('visible');
      uploadTrimState.duration = 0;
      uploadTrimState.startTime = 0;
      uploadTrimState.endTime = 0;
      uploadTrimState.trimmedBlob = null;
      uploadTrimState.isPreviewing = false;
    }

    function showToast(msg, type = 'success') {
      toast.textContent = msg;
      toast.className = `toast ${type} show`;
      setTimeout(() => toast.classList.remove('show'), 3500);
    }

    // --- Upload trim helpers ---
    function updateUploadTrimUI() {
      const dur = uploadTrimState.duration || 1;
      const startPct = (uploadTrimState.startTime / dur) * 100;
      const endPct = (uploadTrimState.endTime / dur) * 100;

      const track = document.getElementById('uploadTrimTrack');
      track.style.left = startPct + '%';
      track.style.width = (endPct - startPct) + '%';

      const dimLeft = document.getElementById('uploadTrimDimLeft');
      const dimRight = document.getElementById('uploadTrimDimRight');
      if (dimLeft) dimLeft.style.width = startPct + '%';
      if (dimRight) dimRight.style.width = (100 - endPct) + '%';

      document.getElementById('uploadTrimStartLabel').textContent = fmtTime(uploadTrimState.startTime);
      document.getElementById('uploadTrimEndLabel').textContent = fmtTime(uploadTrimState.endTime);
      const clipDur = Math.max(0, uploadTrimState.endTime - uploadTrimState.startTime);
      document.getElementById('uploadTrimClipDuration').textContent = 'Clip: ' + fmtTime(clipDur);
      uploadTrimState.trimmedBlob = null;
      document.getElementById('uploadTrimStatus').textContent = '';
      document.getElementById('uploadTrimStatus').className = 'trim-status';
    }

    function generateUploadThumbnails(videoEl) {
      const container = document.getElementById('uploadTrimThumbnails');
      container.innerHTML = '';
      const count = 10;
      const dur = uploadTrimState.duration;
      if (dur <= 0) return;

      const tmpVideo = document.createElement('video');
      tmpVideo.src = videoEl.src;
      tmpVideo.muted = true;
      tmpVideo.preload = 'auto';

      let idx = 0;
      const canvases = [];
      for (let i = 0; i < count; i++) {
        const c = document.createElement('canvas');
        c.width = 96; c.height = 64;
        container.appendChild(c);
        canvases.push(c);
      }

      tmpVideo.addEventListener('loadeddata', () => grabNext());

      function grabNext() {
        if (idx >= count) return;
        const t = (idx / count) * dur + 0.01;
        tmpVideo.currentTime = Math.min(t, dur - 0.01);
        tmpVideo.onseeked = () => {
          const ctx = canvases[idx].getContext('2d');
          ctx.drawImage(tmpVideo, 0, 0, 96, 64);
          idx++;
          grabNext();
        };
      }
    }

    function setupUploadTrimDragHandlers() {
      const timeline = document.getElementById('uploadTrimTimeline');
      const handleLeft = document.getElementById('uploadTrimHandleLeft');
      const handleRight = document.getElementById('uploadTrimHandleRight');

      function pctFromEvent(e) {
        const rect = timeline.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        return Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      }

      function onStart(which) {
        return (e) => { e.preventDefault(); e.stopPropagation(); uploadTrimState.dragging = which; };
      }

      handleLeft.addEventListener('mousedown', onStart('left'));
      handleLeft.addEventListener('touchstart', onStart('left'), { passive: false });
      handleRight.addEventListener('mousedown', onStart('right'));
      handleRight.addEventListener('touchstart', onStart('right'), { passive: false });

      timeline.addEventListener('click', (e) => {
        if (uploadTrimState.dragging) return;
        const pct = pctFromEvent(e);
        const t = pct * uploadTrimState.duration;
        const vid = document.getElementById('uploadTrimPreview');
        vid.currentTime = Math.max(uploadTrimState.startTime, Math.min(uploadTrimState.endTime, t));
      });

      function onMove(e) {
        if (!uploadTrimState.dragging) return;
        const pct = pctFromEvent(e);
        const t = Math.round(pct * uploadTrimState.duration * 10) / 10;
        const MIN_CLIP = 0.5;
        if (uploadTrimState.dragging === 'left') {
          uploadTrimState.startTime = Math.max(0, Math.min(t, uploadTrimState.endTime - MIN_CLIP));
        } else {
          uploadTrimState.endTime = Math.min(uploadTrimState.duration, Math.max(t, uploadTrimState.startTime + MIN_CLIP));
        }
        updateUploadTrimUI();
      }

      function onEnd() { uploadTrimState.dragging = null; }

      document.addEventListener('mousemove', onMove);
      document.addEventListener('touchmove', onMove, { passive: false });
      document.addEventListener('mouseup', onEnd);
      document.addEventListener('touchend', onEnd);
    }

    function setupUploadPlayheadTracker() {
      const vid = document.getElementById('uploadTrimPreview');
      const playhead = document.getElementById('uploadTrimPlayhead');
      const timeOverlay = document.getElementById('uploadTrimTimeOverlay');
      const track = document.getElementById('uploadTrimTrack');

      function tick() {
        if (uploadTrimState.duration > 0) {
          const pct = (vid.currentTime / uploadTrimState.duration) * 100;
          playhead.style.left = pct + '%';
        }

        if (!vid.paused && uploadTrimState.isPreviewing) {
          timeOverlay.textContent = fmtTime(vid.currentTime) + ' / ' + fmtTime(uploadTrimState.endTime);
          timeOverlay.classList.add('visible');

          if (vid.currentTime >= uploadTrimState.endTime - 0.05) {
            vid.pause();
            vid.currentTime = uploadTrimState.startTime;
            uploadTrimState.isPreviewing = false;
            track.classList.remove('previewing');
            timeOverlay.classList.remove('visible');
          }
        } else if (vid.paused && uploadTrimState.isPreviewing) {
          uploadTrimState.isPreviewing = false;
          track.classList.remove('previewing');
          timeOverlay.classList.remove('visible');
        }

        requestAnimationFrame(tick);
      }
      tick();
    }

    function uploadPreviewTrimmedClip() {
      const vid = document.getElementById('uploadTrimPreview');
      const track = document.getElementById('uploadTrimTrack');

      if (uploadTrimState.isPreviewing) {
        vid.pause();
        uploadTrimState.isPreviewing = false;
        track.classList.remove('previewing');
        document.getElementById('uploadTrimTimeOverlay').classList.remove('visible');
        return;
      }

      uploadTrimState.isPreviewing = true;
      track.classList.add('previewing');

      vid.currentTime = uploadTrimState.startTime;
      vid.addEventListener('seeked', function onSeeked() {
        vid.removeEventListener('seeked', onSeeked);
        vid.play().catch(() => {});
      });
    }

    function uploadResetTrim() {
      uploadTrimState.startTime = 0;
      uploadTrimState.endTime = uploadTrimState.duration;
      uploadTrimState.trimmedBlob = null;
      uploadTrimState.isPreviewing = false;
      document.getElementById('uploadTrimTrack').classList.remove('previewing');
      document.getElementById('uploadTrimTimeOverlay').classList.remove('visible');
      updateUploadTrimUI();
      document.getElementById('uploadTrimStatus').textContent = 'Trim reset to full video';
      document.getElementById('uploadTrimStatus').className = 'trim-status';
    }

    async function produceUploadTrimmedBlob() {
      const fullStart = uploadTrimState.startTime;
      const fullEnd = uploadTrimState.endTime;
      const isFullVideo = (fullStart <= 0.05 && fullEnd >= uploadTrimState.duration - 0.05);

      if (isFullVideo) return selectedFile;
      if (uploadTrimState.trimmedBlob) return uploadTrimState.trimmedBlob;

      const statusEl = document.getElementById('uploadTrimStatus');
      statusEl.textContent = 'Trimming clip...';
      statusEl.className = 'trim-status processing';

      const srcVideo = document.createElement('video');
      srcVideo.muted = true;
      srcVideo.playsInline = true;
      srcVideo.src = URL.createObjectURL(selectedFile);

      await new Promise((resolve) => { srcVideo.onloadeddata = resolve; srcVideo.load(); });
      srcVideo.currentTime = fullStart;
      await new Promise((resolve) => { srcVideo.onseeked = resolve; });

      const w = srcVideo.videoWidth || 640;
      const h = srcVideo.videoHeight || 480;
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      const stream = canvas.captureStream(30);

      try {
        const audioCtx = new AudioContext();
        const source = audioCtx.createMediaElementSource(srcVideo);
        const dest = audioCtx.createMediaStreamDestination();
        source.connect(dest);
        source.connect(audioCtx.destination);
        dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
      } catch(_) {}

      let recMime = 'video/mp4;codecs=avc1,mp4a.40.2';
      if (!MediaRecorder.isTypeSupported(recMime)) {
        recMime = 'video/webm;codecs=vp8,opus';
        if (!MediaRecorder.isTypeSupported(recMime)) recMime = 'video/webm';
      }

      const chunks = [];
      const rec = new MediaRecorder(stream, { mimeType: recMime });
      rec.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
      const donePromise = new Promise((resolve) => { rec.onstop = () => resolve(); });

      rec.start();
      srcVideo.play();

      await new Promise((resolve) => {
        function drawFrame() {
          if (srcVideo.currentTime >= fullEnd || srcVideo.ended) {
            srcVideo.pause();
            rec.stop();
            resolve();
            return;
          }
          ctx.drawImage(srcVideo, 0, 0, w, h);
          requestAnimationFrame(drawFrame);
        }
        drawFrame();
      });

      await donePromise;

      const trimmedBlob = new Blob(chunks, { type: rec.mimeType });
      uploadTrimState.trimmedBlob = trimmedBlob;

      try { URL.revokeObjectURL(srcVideo.src); } catch(_) {}

      statusEl.textContent = 'Clip trimmed successfully!';
      statusEl.className = 'trim-status success';
      return trimmedBlob;
    }

    uploadBtn.addEventListener('click', async () => {
      if (!selectedFile) return;
      const errMsg = document.getElementById('errMsg');
      const okMsg = document.getElementById('okMsg');
      errMsg.classList.remove('visible');
      okMsg.classList.remove('visible');

      uploadBtn.disabled = true;

      let fileToUpload;
      try {
        fileToUpload = await produceUploadTrimmedBlob();
      } catch (err) {
        console.error('Trim error:', err);
        fileToUpload = selectedFile;
      }

      const formData = new FormData();
      if (fileToUpload instanceof File) {
        formData.append('video', fileToUpload);
      } else {
        const ext = fileToUpload.type.includes('mp4') ? 'mp4' : 'webm';
        const trimmedFile = new File([fileToUpload], `trimmed_video.${ext}`, { type: fileToUpload.type });
        formData.append('video', trimmedFile);
      }
      formData.append('exercise', document.getElementById('exercise').value);

      document.getElementById('progressWrap').classList.add('visible');

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload');
      xhr.setRequestHeader('Authorization', `Bearer ${Auth.getToken()}`);

      xhr.upload.addEventListener('progress', e => {
        if (e.lengthComputable) {
          const pct = Math.round(e.loaded / e.total * 100);
          document.getElementById('progressFill').style.width = pct + '%';
          document.getElementById('progressLbl').textContent = pct + '%';
        }
      });

      xhr.addEventListener('load', () => {
        document.getElementById('progressWrap').classList.remove('visible');
        document.getElementById('progressFill').style.width = '0%';
        uploadBtn.disabled = false;

        if (xhr.status === 201) {
          okMsg.textContent = 'Uploaded! Waiting for admin approval.';
          okMsg.classList.add('visible');
          clearFile();
        } else {
          const err = JSON.parse(xhr.responseText);
          errMsg.textContent = err.error || 'Upload failed.';
          errMsg.classList.add('visible');
        }
      });

      xhr.addEventListener('error', () => {
        document.getElementById('progressWrap').classList.remove('visible');
        uploadBtn.disabled = false;
        errMsg.textContent = 'Network error.';
        errMsg.classList.add('visible');
      });

      xhr.send(formData);
    });

    // ===== RECORDING MODE LOGIC =====
    let mediaStream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let recordingStartTime = 0;
    let recordingTimeoutId = null;
    const MAX_RECORDING_TIME = 20; // seconds

    function switchMode(mode) {
      console.log('Switching to mode:', mode);
      
      // Update tab active state
      document.querySelectorAll('.mode-tab').forEach(tab => {
        tab.classList.toggle('active', tab.dataset.mode === mode);
      });

      // Update container visibility
      const uploadMode = document.getElementById('upload-mode');
      const recordMode = document.getElementById('record-mode');
      
      if (mode === 'upload') {
        uploadMode.classList.add('active');
        recordMode.classList.remove('active');
      } else {
        uploadMode.classList.remove('active');
        recordMode.classList.add('active');
      }

      if (mode === 'record') {
        // Initialize camera when switching to record mode
        console.log('Initializing camera...');
        initializeCamera();
      } else {
        // Stop any active recording when switching away
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
        }
        stopMediaStream();
      }
    }

    async function initializeCamera() {
      const cameraStatus = document.getElementById('cameraStatus');
      const startBtn = document.getElementById('startRecordBtn');
      const webcamVid = document.getElementById('webcamVideo');

      try {
        if (mediaStream) return; // Already initialized

        cameraStatus.textContent = 'Requesting camera access...';
        cameraStatus.classList.add('visible');

        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: true
        });

        webcamVid.srcObject = mediaStream;
        cameraStatus.style.display = 'none';
        startBtn.disabled = false;
      } catch (err) {
        cameraStatus.textContent = '❌ Camera access denied. Please check permissions in browser settings.';
        cameraStatus.classList.add('visible');
        cameraStatus.style.color = '#ef4444';
        startBtn.disabled = true;
        console.error('Camera error:', err);
      }
    }

    function stopMediaStream() {
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
    }

    async function startRecording() {
      if (!mediaStream) {
        alert('Camera not initialized');
        return;
      }

      try {
        recordedChunks = [];
        const options = { mimeType: 'video/mp4;codecs=avc1,mp4a.40.2' };

        // Fallback options if MP4 not supported
        if (!MediaRecorder.isTypeSupported(options.mimeType)) {
          console.log('MP4 not supported, trying WebM...');
          const webmMimeType = 'video/webm;codecs=vp8,opus';
          if (MediaRecorder.isTypeSupported(webmMimeType)) {
            options.mimeType = webmMimeType;
          }
        }

        mediaRecorder = new MediaRecorder(mediaStream, options);
        mediaRecorder.ondataavailable = e => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };
        mediaRecorder.onstop = handleRecordingStop;

        mediaRecorder.start();
        recordingStartTime = Date.now();

        // Update UI
        document.getElementById('startRecordBtn').style.display = 'none';
        document.getElementById('stopRecordBtn').style.display = 'flex';
        document.getElementById('recording-interface').style.opacity = '0.8';

        // Start timer countdown
        updateTimer();
        recordingTimeoutId = setInterval(updateTimer, 100);

        // Auto-stop after MAX_RECORDING_TIME seconds
        setTimeout(() => {
          if (mediaRecorder && mediaRecorder.state === 'recording') {
            stopRecording();
          }
        }, MAX_RECORDING_TIME * 1000);
      } catch (err) {
        console.error('Recording error:', err);
        alert('Failed to start recording');
      }
    }

    function stopRecording() {
      if (!mediaRecorder || mediaRecorder.state === 'inactive') return;

      mediaRecorder.stop();
      clearInterval(recordingTimeoutId);

      // Restore UI
      document.getElementById('startRecordBtn').style.display = 'flex';
      document.getElementById('stopRecordBtn').style.display = 'none';
      document.getElementById('recording-interface').style.opacity = '1';
      document.getElementById('timerDisplay').textContent = '20';
      document.getElementById('timerDisplay').classList.remove('warning', 'critical');
    }

    function updateTimer() {
      const elapsed = (Date.now() - recordingStartTime) / 1000;
      const remaining = Math.max(0, MAX_RECORDING_TIME - elapsed);
      const display = remaining.toFixed(1);

      const timerEl = document.getElementById('timerDisplay');
      timerEl.textContent = display;

      if (remaining <= 5 && remaining > 2) {
        timerEl.classList.remove('critical');
        timerEl.classList.add('warning');
      } else if (remaining <= 2) {
        timerEl.classList.add('critical');
      } else {
        timerEl.classList.remove('warning', 'critical');
      }
    }

    // ===== TRIM EDITOR STATE =====
    let trimState = {
      duration: 0,
      startTime: 0,
      endTime: 0,
      dragging: null,
      playheadRaf: null,
      trimmedBlob: null,
      isPreviewing: false,
      dragHandlersAttached: false,
    };

    function resolveRecordedBlobDuration(videoEl) {
      return new Promise((resolve) => {
        if (isFinite(videoEl.duration) && videoEl.duration > 0) {
          resolve(videoEl.duration);
          return;
        }
        videoEl.currentTime = 1e10;
        function onSeek() {
          videoEl.removeEventListener('seeked', onSeek);
          const dur = videoEl.duration;
          videoEl.currentTime = 0;
          videoEl.addEventListener('seeked', function onReset() {
            videoEl.removeEventListener('seeked', onReset);
            resolve(isFinite(dur) && dur > 0 ? dur : 0);
          });
        }
        videoEl.addEventListener('seeked', onSeek);
      });
    }

    async function handleRecordingStop() {
      const mimeType = mediaRecorder.mimeType;
      const videoBlob = new Blob(recordedChunks, { type: mimeType });
      const videoUrl = URL.createObjectURL(videoBlob);
      const previewVid = document.getElementById('recordedVideoPreview');
      previewVid.src = videoUrl;

      window.recordedVideoBlob = videoBlob;
      trimState.trimmedBlob = null;
      trimState.isPreviewing = false;

      document.getElementById('recording-interface').style.display = 'none';
      document.getElementById('preview-interface').style.display = 'block';

      await new Promise(r => { previewVid.onloadeddata = r; });

      let dur = await resolveRecordedBlobDuration(previewVid);
      if (dur <= 0) dur = (Date.now() - recordingStartTime) / 1000;

      trimState.duration = dur;
      trimState.startTime = 0;
      trimState.endTime = dur;
      updateTrimUI();
      generateThumbnails(previewVid);

      if (!trimState.dragHandlersAttached) {
        setupTrimDragHandlers();
        trimState.dragHandlersAttached = true;
      }
      setupPlayheadTracker();
    }

    function updateTrimUI() {
      const dur = trimState.duration || 1;
      const startPct = (trimState.startTime / dur) * 100;
      const endPct = (trimState.endTime / dur) * 100;

      const track = document.getElementById('trimTrack');
      track.style.left = startPct + '%';
      track.style.width = (endPct - startPct) + '%';

      const dimLeft = document.getElementById('trimDimLeft');
      const dimRight = document.getElementById('trimDimRight');
      if (dimLeft) dimLeft.style.width = startPct + '%';
      if (dimRight) dimRight.style.width = (100 - endPct) + '%';

      document.getElementById('trimStartLabel').textContent = fmtTime(trimState.startTime);
      document.getElementById('trimEndLabel').textContent = fmtTime(trimState.endTime);

      const clipDur = Math.max(0, trimState.endTime - trimState.startTime);
      document.getElementById('trimClipDuration').textContent = 'Clip: ' + fmtTime(clipDur);

      trimState.trimmedBlob = null;
      document.getElementById('trimStatus').textContent = '';
      document.getElementById('trimStatus').className = 'trim-status';
    }

    function fmtTime(seconds) {
      if (seconds >= 60) {
        const m = Math.floor(seconds / 60);
        const s = (seconds % 60).toFixed(1);
        return m + ':' + (s < 10 ? '0' : '') + s;
      }
      return seconds.toFixed(1) + 's';
    }

    function generateThumbnails(videoEl) {
      const container = document.getElementById('trimThumbnails');
      container.innerHTML = '';
      const count = 10;
      const dur = trimState.duration;
      if (dur <= 0) return;

      const tmpVideo = document.createElement('video');
      tmpVideo.src = videoEl.src;
      tmpVideo.muted = true;
      tmpVideo.preload = 'auto';

      let idx = 0;
      const canvases = [];
      for (let i = 0; i < count; i++) {
        const c = document.createElement('canvas');
        c.width = 96;
        c.height = 64;
        container.appendChild(c);
        canvases.push(c);
      }

      tmpVideo.addEventListener('loadeddata', () => grabNext());

      function grabNext() {
        if (idx >= count) return;
        const t = (idx / count) * dur + 0.01;
        tmpVideo.currentTime = Math.min(t, dur - 0.01);
        tmpVideo.onseeked = () => {
          const ctx = canvases[idx].getContext('2d');
          ctx.drawImage(tmpVideo, 0, 0, 96, 64);
          idx++;
          grabNext();
        };
      }
    }

    function setupTrimDragHandlers() {
      const timeline = document.getElementById('trimTimeline');
      const handleLeft = document.getElementById('trimHandleLeft');
      const handleRight = document.getElementById('trimHandleRight');

      function pctFromEvent(e) {
        const rect = timeline.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        return Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      }

      function onStart(which) {
        return (e) => {
          e.preventDefault();
          e.stopPropagation();
          trimState.dragging = which;
        };
      }

      handleLeft.addEventListener('mousedown', onStart('left'));
      handleLeft.addEventListener('touchstart', onStart('left'), { passive: false });
      handleRight.addEventListener('mousedown', onStart('right'));
      handleRight.addEventListener('touchstart', onStart('right'), { passive: false });

      timeline.addEventListener('click', (e) => {
        if (trimState.dragging) return;
        const pct = pctFromEvent(e);
        const t = pct * trimState.duration;
        const vid = document.getElementById('recordedVideoPreview');
        vid.currentTime = Math.max(trimState.startTime, Math.min(trimState.endTime, t));
      });

      function onMove(e) {
        if (!trimState.dragging) return;
        const pct = pctFromEvent(e);
        const t = Math.round(pct * trimState.duration * 10) / 10;
        const MIN_CLIP = 0.5;
        if (trimState.dragging === 'left') {
          trimState.startTime = Math.max(0, Math.min(t, trimState.endTime - MIN_CLIP));
        } else {
          trimState.endTime = Math.min(trimState.duration, Math.max(t, trimState.startTime + MIN_CLIP));
        }
        updateTrimUI();
      }

      function onEnd() { trimState.dragging = null; }

      document.addEventListener('mousemove', onMove);
      document.addEventListener('touchmove', onMove, { passive: false });
      document.addEventListener('mouseup', onEnd);
      document.addEventListener('touchend', onEnd);
    }

    function setupPlayheadTracker() {
      const vid = document.getElementById('recordedVideoPreview');
      const playhead = document.getElementById('trimPlayhead');
      const timeOverlay = document.getElementById('recTrimTimeOverlay');
      const track = document.getElementById('trimTrack');
      const previewBtn = document.getElementById('trimPreviewBtn');

      function tick() {
        if (trimState.duration > 0) {
          const pct = (vid.currentTime / trimState.duration) * 100;
          playhead.style.left = pct + '%';
        }

        if (!vid.paused && trimState.isPreviewing) {
          timeOverlay.textContent = fmtTime(vid.currentTime) + ' / ' + fmtTime(trimState.endTime);
          timeOverlay.classList.add('visible');

          if (vid.currentTime >= trimState.endTime - 0.05) {
            vid.pause();
            vid.currentTime = trimState.startTime;
            trimState.isPreviewing = false;
            track.classList.remove('previewing');
            previewBtn.classList.remove('previewing');
            timeOverlay.classList.remove('visible');
          }
        } else if (vid.paused && trimState.isPreviewing) {
          trimState.isPreviewing = false;
          track.classList.remove('previewing');
          previewBtn.classList.remove('previewing');
          timeOverlay.classList.remove('visible');
        }

        trimState.playheadRaf = requestAnimationFrame(tick);
      }

      if (trimState.playheadRaf) cancelAnimationFrame(trimState.playheadRaf);
      tick();
    }

    function previewTrimmedClip() {
      const vid = document.getElementById('recordedVideoPreview');
      const track = document.getElementById('trimTrack');
      const previewBtn = document.getElementById('trimPreviewBtn');

      if (trimState.isPreviewing) {
        vid.pause();
        trimState.isPreviewing = false;
        track.classList.remove('previewing');
        previewBtn.classList.remove('previewing');
        document.getElementById('recTrimTimeOverlay').classList.remove('visible');
        return;
      }

      trimState.isPreviewing = true;
      track.classList.add('previewing');
      previewBtn.classList.add('previewing');

      vid.currentTime = trimState.startTime;
      vid.addEventListener('seeked', function onSeeked() {
        vid.removeEventListener('seeked', onSeeked);
        vid.play().catch(() => {});
      });
    }

    function resetTrim() {
      trimState.startTime = 0;
      trimState.endTime = trimState.duration;
      trimState.trimmedBlob = null;
      trimState.isPreviewing = false;
      document.getElementById('trimTrack').classList.remove('previewing');
      document.getElementById('trimPreviewBtn').classList.remove('previewing');
      document.getElementById('recTrimTimeOverlay').classList.remove('visible');
      updateTrimUI();
      document.getElementById('trimStatus').textContent = 'Trim reset to full recording';
      document.getElementById('trimStatus').className = 'trim-status';
    }

    async function produceTrimmedBlob() {
      const fullStart = trimState.startTime;
      const fullEnd = trimState.endTime;
      const isFullVideo = (fullStart <= 0.05 && fullEnd >= trimState.duration - 0.05);

      if (isFullVideo) return window.recordedVideoBlob;
      if (trimState.trimmedBlob) return trimState.trimmedBlob;

      const statusEl = document.getElementById('trimStatus');
      statusEl.textContent = 'Trimming clip...';
      statusEl.className = 'trim-status processing';

      const srcVideo = document.createElement('video');
      srcVideo.muted = true;
      srcVideo.playsInline = true;
      srcVideo.src = URL.createObjectURL(window.recordedVideoBlob);

      await new Promise((resolve) => {
        srcVideo.onloadeddata = resolve;
        srcVideo.load();
      });

      srcVideo.currentTime = fullStart;
      await new Promise((resolve) => { srcVideo.onseeked = resolve; });

      const w = srcVideo.videoWidth || 640;
      const h = srcVideo.videoHeight || 480;
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');

      const stream = canvas.captureStream(30);

      // Try to capture audio from the original blob
      try {
        const audioCtx = new AudioContext();
        const source = audioCtx.createMediaElementSource(srcVideo);
        const dest = audioCtx.createMediaStreamDestination();
        source.connect(dest);
        source.connect(audioCtx.destination);
        dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
      } catch(_) { /* no audio track or unsupported */ }

      let recMime = 'video/mp4;codecs=avc1,mp4a.40.2';
      if (!MediaRecorder.isTypeSupported(recMime)) {
        recMime = 'video/webm;codecs=vp8,opus';
        if (!MediaRecorder.isTypeSupported(recMime)) {
          recMime = 'video/webm';
        }
      }

      const chunks = [];
      const rec = new MediaRecorder(stream, { mimeType: recMime });
      rec.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };

      const donePromise = new Promise((resolve) => {
        rec.onstop = () => resolve();
      });

      rec.start();
      srcVideo.play();

      await new Promise((resolve) => {
        function drawFrame() {
          if (srcVideo.currentTime >= fullEnd || srcVideo.ended) {
            srcVideo.pause();
            rec.stop();
            resolve();
            return;
          }
          ctx.drawImage(srcVideo, 0, 0, w, h);
          requestAnimationFrame(drawFrame);
        }
        drawFrame();
      });

      await donePromise;

      const trimmedBlob = new Blob(chunks, { type: rec.mimeType });
      trimState.trimmedBlob = trimmedBlob;

      try { URL.revokeObjectURL(srcVideo.src); } catch(_) {}

      statusEl.textContent = 'Clip trimmed successfully!';
      statusEl.className = 'trim-status success';
      return trimmedBlob;
    }

    function reRecord() {
      window.recordedVideoBlob = null;
      trimState.trimmedBlob = null;
      trimState.startTime = 0;
      trimState.endTime = 0;
      trimState.duration = 0;
      trimState.isPreviewing = false;
      if (trimState.playheadRaf) {
        cancelAnimationFrame(trimState.playheadRaf);
        trimState.playheadRaf = null;
      }
      document.getElementById('recordedVideoPreview').src = '';
      document.getElementById('trimThumbnails').innerHTML = '';
      document.getElementById('recTrimTimeOverlay').classList.remove('visible');
      document.getElementById('trimTrack').classList.remove('previewing');
      document.getElementById('trimPreviewBtn').classList.remove('previewing');

      document.getElementById('recording-interface').style.display = 'block';
      document.getElementById('preview-interface').style.display = 'none';
      document.getElementById('timerDisplay').textContent = '20';

      document.getElementById('startRecordBtn').style.display = 'flex';
      document.getElementById('stopRecordBtn').style.display = 'none';
    }

    async function uploadRecordedVideo() {
      if (!window.recordedVideoBlob) {
        alert('No recorded video');
        return;
      }

      const uploadBtn = document.getElementById('uploadRecordedBtn');
      uploadBtn.disabled = true;

      let blobToUpload;
      try {
        blobToUpload = await produceTrimmedBlob();
      } catch (err) {
        console.error('Trim error:', err);
        blobToUpload = window.recordedVideoBlob;
      }

      const exercise = document.getElementById('recordExercise').value;
      const timestamp = new Date().toISOString().replace(/[:.]/g, '-');

      const ext = blobToUpload.type.includes('mp4') ? 'mp4' : 'webm';
      const videoFile = new File(
        [blobToUpload],
        `recorded_exercise_${timestamp}.${ext}`,
        { type: blobToUpload.type || 'video/webm' },
      );

      const recErrMsg = document.getElementById('recErrMsg');
      const recOkMsg = document.getElementById('recOkMsg');
      recErrMsg.classList.remove('visible');
      recOkMsg.classList.remove('visible');

      const formData = new FormData();
      formData.append('video', videoFile);
      formData.append('exercise', exercise);

      document.getElementById('recordProgressWrap').classList.add('visible');

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload');
      xhr.setRequestHeader('Authorization', `Bearer ${Auth.getToken()}`);

      xhr.upload.addEventListener('progress', e => {
        if (e.lengthComputable) {
          const pct = Math.round(e.loaded / e.total * 100);
          document.getElementById('recordProgressFill').style.width = pct + '%';
          document.getElementById('recordProgressLbl').textContent = pct + '%';
        }
      });

      xhr.addEventListener('load', () => {
        document.getElementById('recordProgressWrap').classList.remove('visible');
        document.getElementById('recordProgressFill').style.width = '0%';
        uploadBtn.disabled = false;

        if (xhr.status === 201) {
          recOkMsg.textContent = 'Video uploaded! Waiting for admin approval.';
          recOkMsg.classList.add('visible');
          reRecord();
          setTimeout(() => {
            switchMode('upload');
            document.getElementById('recOkMsg').innerText = '';
          }, 2000);
        } else {
          const err = JSON.parse(xhr.responseText);
          recErrMsg.textContent = err.error || 'Upload failed.';
          recErrMsg.classList.add('visible');
        }
      });

      xhr.addEventListener('error', () => {
        document.getElementById('recordProgressWrap').classList.remove('visible');
        uploadBtn.disabled = false;
        recErrMsg.textContent = 'Network error.';
        recErrMsg.classList.add('visible');
      });

      xhr.send(formData);
    }

    // Stop recording and clean up when page is closed
    window.addEventListener('beforeunload', () => {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
      }
      stopMediaStream();
    });
  </script>
</body>
