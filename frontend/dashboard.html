<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Uploads — Pose Matcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css" />
  <style>
    .upload-list { display: flex; flex-direction: column; gap: 16px; }

    .upload-item {
      background: linear-gradient(145deg, #181818 0%, #121212 100%);
      border: 1px solid #252525;
      border-radius: 16px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      transition: all 0.25s ease;
    }
    .upload-item:hover { border-color: #2dd4bf; box-shadow: 0 8px 32px rgba(45, 212, 191, 0.08); }

    .upload-item video {
      width: 110px;
      height: 74px;
      object-fit: cover;
      border-radius: 12px;
      background: #0f0f0f;
      flex-shrink: 0;
    }

    .upload-info { flex: 1; min-width: 160px; }
    .upload-name { font-weight: 700; font-size: 1rem; text-transform: capitalize; color: #fff; }
    .upload-meta { font-size: 0.8rem; color: #6b7280; margin-top: 6px; line-height: 1.7; }
    .upload-note { font-size: 0.8rem; color: #9ca3af; font-style: italic; margin-top: 8px; padding: 8px 12px; background: rgba(45, 212, 191, 0.05); border-radius: 8px; border-left: 2px solid #2dd4bf; }

    .upload-actions { display: flex; gap: 10px; align-items: center; }

    .header-row { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      margin-bottom: 32px; 
      flex-wrap: wrap; 
      gap: 16px; 
    }

    .btn-delete {
      background: transparent;
      border: 1px solid #ef4444;
      color: #ef4444;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-delete:hover {
      background: #ef4444;
      color: #fff;
    }
    .btn-delete:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <nav id="navBar"></nav>

  <div class="page">
    <div class="header-row">
      <div>
        <div class="page-title">My Uploads</div>
        <p class="page-sub" style="margin-bottom:0">Track the status of your submitted reference videos.</p>
      </div>
      <a href="/upload" class="btn btn-primary">+ Upload New</a>
    </div>

    <div class="upload-list" id="uploadList">
      <div class="empty">
        <div class="icon">
          <svg width="28" height="28" fill="none" stroke="#525252" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="14" cy="14" r="10"/>
            <polyline points="14 8 14 14 18 16"/>
          </svg>
        </div>
        <p>Loading...</p>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/auth.js"></script>
  <script>
    Auth.guard();

    const user = Auth.getUser();
    document.getElementById('navBar').innerHTML = `
      <a class="nav-logo" href="/">Pose Matcher</a>
      <div class="nav-links">
        <a href="/">Exercises</a>
        <a href="/upload">Upload Video</a>
        <a href="/reports">My Reports</a>
        <a href="/profile">Profile</a>
        <span class="nav-user">${user.username}</span>
        <button class="nav-logout" onclick="Auth.logout()">Logout</button>
      </div>`;

    const toast = document.getElementById('toast');

    function showToast(msg, type = 'success') {
      toast.textContent = msg;
      toast.className = `toast ${type} show`;
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    async function deleteVideo(id) {
      if (!confirm('Are you sure you want to delete this video? This cannot be undone.')) return;
      
      const btn = document.querySelector(`#video-${id} .btn-delete`);
      if (btn) btn.disabled = true;

      try {
        const res = await Auth.apiFetch(`/api/videos/${id}`, { method: 'DELETE' });
        if (res.ok) {
          showToast('Video deleted', 'success');
          load();
        } else {
          const err = await res.json();
          showToast(err.error || 'Failed to delete', 'error');
          if (btn) btn.disabled = false;
        }
      } catch {
        showToast('Network error', 'error');
        if (btn) btn.disabled = false;
      }
    }

    async function load() {
      const list = document.getElementById('uploadList');
      try {
        const res = await Auth.apiFetch('/api/my-uploads');
        const videos = await res.json();

        if (videos.length === 0) {
          list.innerHTML = `<div class="empty">
            <div class="icon">
              <svg width="28" height="28" fill="none" stroke="#525252" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="5" width="22" height="16" rx="2" ry="2"/>
                <polygon points="10 9 16 12 10 15 10 9"/>
              </svg>
            </div>
            <p>No uploads yet.<br><a href="/upload">Upload your first reference video</a></p>
          </div>`;
          return;
        }

        list.innerHTML = videos.slice().reverse().map(v => `
          <div class="upload-item" id="video-${v.id}">
            <video src="/api/video/${v.id}" preload="metadata" controls></video>
            <div class="upload-info">
              <div class="upload-name">${v.exercise.replace(/_/g,' ')}</div>
              <div class="upload-meta">
                ${v.original_name}<br>
                Uploaded ${new Date(v.uploaded_at).toLocaleDateString()}
                ${v.reviewed_at ? ` &bull; Reviewed ${new Date(v.reviewed_at).toLocaleDateString()}` : ''}
              </div>
              ${v.admin_note ? `<div class="upload-note">Admin note: ${v.admin_note}</div>` : ''}
            </div>
            <div class="upload-actions">
              <span class="badge badge-${v.status}">${v.status}</span>
              <button class="btn-delete" onclick="deleteVideo('${v.id}')">Delete</button>
            </div>
          </div>
        `).join('');
      } catch {
        list.innerHTML = `<div class="empty">
          <div class="icon">
            <svg width="28" height="28" fill="none" stroke="#525252" stroke-width="2">
              <circle cx="14" cy="14" r="10"/>
              <line x1="14" y1="10" x2="14" y2="14"/>
              <line x1="14" y1="18" x2="14.01" y2="18"/>
            </svg>
          </div>
          <p>Could not load uploads.</p>
        </div>`;
      }
    }

    load();
  </script>
</body>
</html>
