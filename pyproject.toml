[project]
name = "pose-matcher"
version = "0.1.0"
description = "Skeleton pose matching using MediaPipe and DTW"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mediapipe==0.10.21",
    "opencv-python",
    "numpy",
    "scipy",
    "dtaidistance",
    "matplotlib",
    "rich",
    "flask",
    "flask-cors",
    "pyjwt>=2.12.1",
    "bcrypt>=5.0.0",
    "prisma>=0.15.0",
    "python-dotenv>=1.2.2",
    "reportlab>=4.2.5",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
