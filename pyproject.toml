[project]
name = "pose-matcher"
version = "0.1.0"
description = "Skeleton pose matching using MediaPipe and DTW"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mediapipe",
    "opencv-python",
    "numpy",
    "scipy",
    "dtaidistance",
    "matplotlib",
    "rich",
    "flask",
    "flask-cors",
    "pyjwt>=2.12.1",
    "bcrypt>=5.0.0",
    "prisma>=0.15.0",
    "python-dotenv>=1.2.2",
]
